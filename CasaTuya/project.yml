name: CasaTuya
options:
  bundleIdPrefix: com.seunome
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CasaTuya:
    type: application
    platform: iOS
    sources: [CasaTuya]
    info:
      path: CasaTuya/Info.plist
      properties:
        CFBundleDisplayName: Casa
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seunome.casatuya
        TARGETED_DEVICE_FAMILY: "1"
